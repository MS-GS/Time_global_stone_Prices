<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIME GLOBAL - Premium Stones</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS (Default RTL for Arabic) -->
    <link id="bs-css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #f8fafc;
        }

        /* Arabic Font Override */
        html[dir="rtl"] body {
            font-family: 'Noto Kufi Arabic', sans-serif;
        }

        /* Navbar Glassmorphism */
        .lang-navbar {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Clean Hover Animation for Cards */
        .hover-lift {
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .hover-lift:hover {
            transform: translateY(-6px);
            box-shadow: 0 1.25rem 2.5rem rgba(0, 0, 0, 0.08) !important;
        }

        /* Hero Image Overlay styling */
        .hero-section {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            position: relative;
            overflow: hidden;
        }

        .hero-section::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://images.unsplash.com/photo-1604928141064-207cea6f5722?auto=format&fit=crop&w=1920&q=80') center/cover;
            opacity: 0.15;
            mix-blend-mode: overlay;
            pointer-events: none;
        }
    </style>
</head>

<body>


    <div class="container p-5">

        <header class="hero-section text-center rounded-5 py-5 mb-5 shadow-sm text-white">
            <div class="px-3 position-relative z-1">
                <h1 class="fw-bolder display-4 mb-2" style="letter-spacing: -0.5px;">TIME <span
                        class="text-danger">GLOBAL</span></h1>
                <p class="lead fw-normal text-white-50 mb-4" id="t-subtitle">مجموعة أحجار المناظر الطبيعية والديكور</p>
                <span class="badge text-bg-danger fs-6 px-4 py-2 rounded-pill shadow-sm" id="t-badge">
                    <i class="bi bi-tag-fill mx-1"></i> قائمة أسعار 2026
                </span>
            </div>
        </header>

        <div class="card border-0 shadow-sm rounded-4 mb-5">
            <div class="card-body p-4 d-flex align-items-start">
                <i class="bi bi-info-circle-fill text-danger fs-2 mx-3"></i>
                <div class="flex-grow-1">
                    <h6 class="fw-bold text-dark mb-2 mt-1" id="t-info-title">ملاحظات مهمة</h6>
                    <ul class="mb-0 text-muted small" id="t-info-list"
                        style="padding-inline-start: 1.25rem; line-height: 1.7;">
                        <li> الحد الأدنى للطلب الدولي : 27 طن</li>
                        <li class="mb-1">الأسعار <strong>تسليم المصنع</strong> ولا تشمل ضريبة القيمة المضافة.</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="productGrid">
            <!-- Rendered by JavaScript -->
        </div>

    </div>

    <script>
        const products = [
            {
                code: "A-01",
                img: "white.jpg",
                sizes: "(1-2) (2-4) (4-6) (6-8) (10-15-20) cm",
                prices: ["$116", "$136", "$168"],
                title: "WHITE"
            },
            {
                code: "A-02",
                img: "black.jpg",
                sizes: "(1-2) (2-4) (4-6) (6-8) (10-15-20) cm",
                prices: ["$136", "$157", "$178"],
                title: "BLACK"
            },
            {
                code: "A-03",
                img: "maroon.jpg",
                sizes: "(1-2) (2-4) (4-6) (6-8) (10-15-20) cm",
                prices: ["$136", "$157", "$178"],
                title: "MAROON"
            },
            {
                code: "A-04",
                img: "granite.jpg",
                sizes: "(1-2) (2-4) (4-6) (6-8) (10-15-20) cm",
                prices: ["$157", "$178", "$200"],
                title: "GRANITE"
            },
            {
                code: "A-05",
                img: "rainbow.jpg",
                sizes: "(1-2) (2-4) (4-6) (6-8) (10-15-20) cm",
                prices: ["$210", "$231", "$252"],
                title: "RAINBOW"
            },
            {
                code: "A-06",
                img: "green.jpg",
                sizes: "(1-2) (2-4) (4-6) (6-8) (10-15-20) cm",
                prices: ["$210", "$231", "$252"],
                title: "GREEN"
            },
            {
                code: "A-07",
                img: "basalt.jpg",
                sizes: "(1-2) (2-4) (4-6) (6-8) (10-15-20) cm",
                prices: ["$126", "$147", "$168"],
                title: "BASALT"
            },
            {
                code: "A-08",
                img: "RIVER.jpg",
                sizes: "(1-2) (2-4) (4-6) (6-8) (10-15-20) cm",
                prices: ["$84", "$105", "$136"],
                title: "RIVER PEBBLES"
            },
            {
                code: "A-09",
                img: "pomza-tasi.jpg",
                sizes: "(1-2) cm",
                prices: ["$63", "$95", "—"],
                title: "POMZA TAŞI"
            },
            {
                code: "A-10",
                img: "broken-lava.jpg",
                sizes: "(1-2) (2-4) (4-6) (6-8) (10-15-20) cm",
                prices: ["$230", "_", "_"],
                title: "broken LAVA"
            }
        ];

        const labels = { sizes: "المقاسات", cuval: "كيس (طن)", paket: "عبوة 18 كجم", kafes: "قفص (طن)" };

        function renderGrid() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            products.forEach(p => {
                const isKafesEmpty = p.prices[2] === "—";
                const kafesColor = isKafesEmpty ? "text-muted opacity-50 fw-normal" : "text-success fw-bolder";
                const kafesVal = isKafesEmpty ? "—" : p.prices[2];

                const cardHTML = `
                    <div class="col">
                        <div class="card h-100 border-0 rounded-4 shadow-sm hover-lift">
                            <div class="position-relative">
                                <img src="${p.img}" alt="${p.title}" class="card-img-top rounded-top-4" style="height: 220px; object-fit: cover;">
                                <span class="badge text-bg-light px-3 py-1 text-dark rounded-3 position-absolute top-0 start-0 m-3 shadow-sm border border-light" style="font-size: 0.85rem; letter-spacing: 0.5px; backdrop-filter: blur(8px); background-color: rgba(255,255,255,0.85) !important;">
                                    ${p.code}
                                </span>
                            </div>
                            
                            <div class="card-body d-flex flex-column p-4">
                                <h4 class="card-title fw-bold text-dark mb-3 mt-1" style="font-size: 1.25rem;">${p.title}</h4>
                                
                                <div class="d-flex align-items-center justify-content-center bg-light rounded-3 py-2 px-3 mb-4 border border-light-subtle shadow-sm">
                                    <i class="bi bi-arrows-angle-expand text-muted mx-2"></i> 
                                    <span class="small fw-semibold text-muted mx-1">${labels.sizes}:</span> 
                                    <span class="small fw-bold text-dark" style="direction: ltr; unicode-bidi: embed;">${p.sizes}</span>
                                </div>

                                <div class="row g-2 text-center mt-auto">
                                    <div class="col-4">
                                        <div class="p-2 rounded-3 border bg-white h-100 d-flex flex-column justify-content-center">
                                            <span class="text-uppercase text-muted d-block mb-1" style="font-size: 0.65rem; font-weight: 700;">${labels.cuval}</span>
                                            <span class="d-block fw-bolder text-success" style="font-size: 1.1rem;">${p.prices[0]}</span>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="p-2 rounded-3 border bg-white h-100 d-flex flex-column justify-content-center">
                                            <span class="text-uppercase text-muted d-block mb-1" style="font-size: 0.65rem; font-weight: 700;">${labels.paket}</span>
                                            <span class="d-block fw-bolder text-success" style="font-size: 1.1rem;">${p.prices[1]}</span>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="p-2 rounded-3 border bg-white h-100 d-flex flex-column justify-content-center">
                                            <span class="text-uppercase text-muted d-block mb-1" style="font-size: 0.65rem; font-weight: 700;">${labels.kafes}</span>
                                            <span class="d-block ${kafesColor}" style="font-size: 1.1rem;">${kafesVal}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        document.documentElement.setAttribute('dir', 'rtl');
        document.documentElement.setAttribute('lang', 'ar');
        const bsLink = document.getElementById('bs-css');
        bsLink.href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css";

        document.addEventListener('DOMContentLoaded', () => {
            renderGrid();
        });
    </script>
</body>

</html>
